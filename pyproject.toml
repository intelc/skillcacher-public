[project]
name = "skillcacher"
version = "0.0.1"
description = "Drop-in proxy with auto-mined skill caching for Claude Code"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "litellm>=1.55.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "click>=8.1",
  "pyarrow>=18.0",
  "transformers>=4.46",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]

[project.scripts]
skillcacher-proxy = "skillcacher.proxy.server:main"
skillcacher-bench = "skillcacher.bench.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
